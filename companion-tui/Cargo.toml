[package]
name = "companion-tui"
version = "0.1.0"
description = "Companion — Terminal UI with voice interaction"
authors = ["Companion Contributors"]
license = "MIT"
edition = "2021"

[[bin]]
name = "companion-tui"
path = "src/main.rs"

[dependencies]
companion-core = { path = "../companion-core" }
ratatui = "0.29"
crossterm = "0.28"
clap = { version = "4", features = ["derive"] }
tokio = { version = "1", features = ["full"] }
crossbeam = "0.8"
serde_json = "1"
log = "0.4"
env_logger = "0.11"
